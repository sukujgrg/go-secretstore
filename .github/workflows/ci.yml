name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install libsecret
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Build CLI
        run: go build -o bin/secretstore ./cmd/secretstore

      - name: Test without CGO
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

      - name: Native store
        if: runner.os == 'macOS'
        run: go test -tags secretstore_native -count=1 ./...

  windows:
    name: Test (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Build CLI
        run: go build -o bin/secretstore.exe ./cmd/secretstore

      - name: Native store
        run: go test -tags secretstore_native -count=1 ./...
